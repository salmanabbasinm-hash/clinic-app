{
 "name": "clinic",
 "permissions": {
  "contents": "write"
 },
 "jobs": {
  "unpack": {
   "if": "github.event_name == 'push'",
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Unzip into repository",
     "run": "unzip -o clinic-app-repo.zip -x \".github/*\" -d .\nrm -f clinic-app-repo.zip\ngit config user.name \"github-actions\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit add -A\ngit commit -m \"unpack clinic-app-repo.zip\" || echo \"nothing to commit\"\ngit push\n"
    }
   ]
  },
  "exe": {
   "if": "${{ always() && ((github.event_name == 'push' && needs.unpack.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.what == 'exe')) }}",
   "runs-on": "windows-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12"
     }
    },
    {
     "run": "pip install pyinstaller pyodbc"
    },
    {
     "name": "Build ClinicSync.exe",
     "shell": "bash",
     "run": "pyinstaller --onefile --name ClinicSync \\\n --add-data \"pc/app.html;.\" --add-data \"pc/sw.js;.\" --add-data \"pc/manifest.webmanifest;.\" \\\n --add-data \"pc/icon.svg;.\" --add-data \"pc/jameel.woff;.\" \\\n pc/clinic_sync.py\n"
    },
    {
     "uses": "softprops/action-gh-release@v2",
     "with": {
      "tag_name": "latest",
      "name": "Latest build",
      "make_latest": "true",
      "files": "dist/ClinicSync.exe"
     }
    },
    {
     "name": "Publish to updates repo (skipped if no UPDATE_TOKEN)",
     "shell": "bash",
     "env": {
      "UPDATE_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "GH_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "UPD_REPO": "salmanabbasinm-hash/clinic-updates",
      "VER": "2026-11-02a"
     },
     "run": "if [ -z \"$UPDATE_TOKEN\" ]; then echo 'no UPDATE_TOKEN - skipped'; exit 0; fi\ngh release view latest -R $UPD_REPO >/dev/null 2>&1 || gh release create latest -R $UPD_REPO -t \"Latest\" -n \"Clinic app\"\ngh release upload latest dist/ClinicSync.exe -R $UPD_REPO --clobber\ngit clone -q https://x-access-token:$UPDATE_TOKEN@github.com/$UPD_REPO.git upd && cd upd\nB=https://github.com/$UPD_REPO/releases/latest/download\necho \"{\\\"v\\\":\\\"$VER\\\",\\\"apk\\\":\\\"$B/ClinicApp.apk\\\",\\\"exe\\\":\\\"$B/ClinicSync.exe\\\",\\\"web\\\":\\\"https://salmanabbasinm-hash.github.io/clinic-app/\\\"}\" > version.json\ncat > index.html <<H\n<!doctype html><meta charset=utf-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>Salman Herbal Clinic - Downloads</title>\n<body dir=rtl style=\"font-family:sans-serif;max-width:420px;margin:0 auto;padding:24px 16px;text-align:center;background:#f4f7f4\">\n<h2 style=\"color:#1b5e20\">سلمان ہربل کلینک</h2><p>اپنی مرضی کی ایپ ڈاؤنلوڈ کریں</p>\n<a style=\"display:block;padding:18px;margin:14px 0;background:#2e7d32;color:#fff;border-radius:14px;text-decoration:none;font-size:20px\" href=\"$B/ClinicApp.apk\">📱 Android ایپ (APK)</a>\n<a style=\"display:block;padding:18px;margin:14px 0;background:#1565c0;color:#fff;border-radius:14px;text-decoration:none;font-size:20px\" href=\"$B/ClinicSync.exe\">💻 Windows ایپ (EXE)</a>\n<a style=\"display:block;padding:18px;margin:14px 0;background:#6a1b9a;color:#fff;border-radius:14px;text-decoration:none;font-size:20px\" href=\"https://salmanabbasinm-hash.github.io/clinic-app/\">🍎 iPhone / ویب ایپ</a>\n<small>ورژن $VER</small>\nH\ngit config user.name bot; git config user.email bot@users.noreply.github.com\ngit add -A; git commit -qm \"version $VER\" || true; for i in 1 2 3; do git pull -q --rebase; git push -q && break; sleep 5; done"
    }
   ],
   "needs": "unpack"
  },
  "apk": {
   "if": "${{ always() && ((github.event_name == 'push' && needs.unpack.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.what == 'apk')) }}",
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-node@v4",
     "with": {
      "node-version": 20
     }
    },
    {
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": 17
     }
    },
    {
     "name": "Build debug APK",
     "run": "mkdir -p www\ncp index.html manifest.webmanifest sw.js icon.svg jameel.woff www/\necho '{\"appId\":\"com.salman.clinic\",\"appName\":\"Clinic\",\"webDir\":\"www\",\"server\":{\"androidScheme\":\"http\",\"cleartext\":true}}' > capacitor.config.json\nnpm init -y\nnpm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6\nmkdir -p ~/.android && echo '' | base64 -d > ~/.android/debug.keystore\nnpx cap add android\nnpx cap sync android\ncd android && chmod +x gradlew && ./gradlew assembleDebug\ncd .. && cp android/app/build/outputs/apk/debug/app-debug.apk ClinicApp.apk\n"
    },
    {
     "uses": "softprops/action-gh-release@v2",
     "with": {
      "tag_name": "latest",
      "name": "Latest build",
      "make_latest": "true",
      "files": "ClinicApp.apk"
     }
    },
    {
     "name": "Publish to updates repo (skipped if no UPDATE_TOKEN)",
     "shell": "bash",
     "env": {
      "UPDATE_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "GH_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "UPD_REPO": "salmanabbasinm-hash/clinic-updates",
      "VER": "2026-11-02a"
     },
     "run": "if [ -z \"$UPDATE_TOKEN\" ]; then echo 'no UPDATE_TOKEN - skipped'; exit 0; fi\ngh release view latest -R $UPD_REPO >/dev/null 2>&1 || gh release create latest -R $UPD_REPO -t \"Latest\" -n \"Clinic app\"\ngh release upload latest ClinicApp.apk -R $UPD_REPO --clobber\ngit clone -q https://x-access-token:$UPDATE_TOKEN@github.com/$UPD_REPO.git upd && cd upd\nB=https://github.com/$UPD_REPO/releases/latest/download\necho \"{\\\"v\\\":\\\"$VER\\\",\\\"apk\\\":\\\"$B/ClinicApp.apk\\\",\\\"exe\\\":\\\"$B/ClinicSync.exe\\\",\\\"web\\\":\\\"https://salmanabbasinm-hash.github.io/clinic-app/\\\"}\" > version.json\ncat > index.html <<H\n<!doctype html><meta charset=utf-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>Salman Herbal Clinic - Downloads</title>\n<body dir=rtl style=\"font-family:sans-serif;max-width:420px;margin:0 auto;padding:24px 16px;text-align:center;background:#f4f7f4\">\n<h2 style=\"color:#1b5e20\">سلمان ہربل کلینک</h2><p>اپنی مرضی کی ایپ ڈاؤنلوڈ کریں</p>\n<a style=\"display:block;padding:18px;margin:14px 0;background:#2e7d32;color:#fff;border-radius:14px;text-decoration:none;font-size:20px\" href=\"$B/ClinicApp.apk\">📱 Android ایپ (APK)</a>\n<a style=\"display:block;padding:18px;margin:14px 0;background:#1565c0;color:#fff;border-radius:14px;text-decoration:none;font-size:20px\" href=\"$B/ClinicSync.exe\">💻 Windows ایپ (EXE)</a>\n<a style=\"display:block;padding:18px;margin:14px 0;background:#6a1b9a;color:#fff;border-radius:14px;text-decoration:none;font-size:20px\" href=\"https://salmanabbasinm-hash.github.io/clinic-app/\">🍎 iPhone / ویب ایپ</a>\n<small>ورژن $VER</small>\nH\ngit config user.name bot; git config user.email bot@users.noreply.github.com\ngit add -A; git commit -qm \"version $VER\" || true; for i in 1 2 3; do git pull -q --rebase; git push -q && break; sleep 5; done"
    }
   ],
   "needs": "unpack"
  }
 },
 "on": {
  "push": {
   "paths": [
    "clinic-app-repo.zip"
   ]
  },
  "workflow_dispatch": {
   "inputs": {
    "what": {
     "description": "Build which?",
     "type": "choice",
     "default": "exe",
     "options": [
      "exe",
      "apk"
     ]
    }
   }
  }
 }
}
