{
 "name": "clinic",
 "permissions": {
  "contents": "write"
 },
 "jobs": {
  "unpack": {
   "if": "github.event_name == 'push'",
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "fetch-depth": 2
     }
    },
    {
     "name": "Unzip into repository",
     "run": "git config user.name \"github-actions\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit diff --name-only --diff-filter=A HEAD^ HEAD -- '*.zip' > /tmp/newzips.txt || true\ncat /tmp/newzips.txt\nwhile IFS= read -r z; do\n  [ -f \"$z\" ] && unzip -o \"$z\" -x \".github/*\" -d .\ndone < /tmp/newzips.txt\nfind . -maxdepth 1 -name '*.zip' -delete\ngit add -A\ngit commit -m \"unpack zip\" || echo \"nothing to commit\"\ngit push\n"
    }
   ]
  },
  "exe": {
   "if": "${{ always() && ((github.event_name == 'push' && needs.unpack.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.what == 'exe')) }}",
   "runs-on": "windows-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12"
     }
    },
    {
     "run": "pip install pyinstaller pyodbc"
    },
    {
     "name": "Make icons from icon-source.png (if present)",
     "shell": "bash",
     "run": "bash ci/make_icons.sh"
    },
    {
     "name": "Build ClinicSync.exe",
     "shell": "bash",
     "run": "bash ci/build_exe.sh"
    },
    {
     "uses": "softprops/action-gh-release@v2",
     "with": {
      "tag_name": "latest",
      "name": "Latest build",
      "make_latest": "true",
      "files": "dist/ClinicSync.exe"
     }
    },
    {
     "name": "Publish to updates repo (skipped if no UPDATE_TOKEN)",
     "shell": "bash",
     "run": "bash ci/publish.sh dist/ClinicSync.exe",
     "env": {
      "UPDATE_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "GH_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "UPD_REPO": "salmanabbasinm-hash/clinic-updates"
     }
    }
   ],
   "needs": "unpack"
  },
  "apk": {
   "if": "${{ always() && ((github.event_name == 'push' && needs.unpack.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.what == 'apk')) }}",
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-node@v4",
     "with": {
      "node-version": 20
     }
    },
    {
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": 17
     }
    },
    {
     "name": "Make icons from icon-source.png (if present)",
     "shell": "bash",
     "run": "bash ci/make_icons.sh"
    },
    {
     "name": "Build debug APK",
     "shell": "bash",
     "run": "bash ci/build_apk.sh"
    },
    {
     "uses": "softprops/action-gh-release@v2",
     "with": {
      "tag_name": "latest",
      "name": "Latest build",
      "make_latest": "true",
      "files": "ClinicApp.apk"
     }
    },
    {
     "name": "Publish to updates repo (skipped if no UPDATE_TOKEN)",
     "shell": "bash",
     "run": "bash ci/publish.sh ClinicApp.apk",
     "env": {
      "UPDATE_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "GH_TOKEN": "${{ secrets.UPDATE_TOKEN }}",
      "UPD_REPO": "salmanabbasinm-hash/clinic-updates"
     }
    }
   ],
   "needs": "unpack"
  }
 },
 "on": {
  "push": {
   "paths": [
    "*.zip"
   ]
  },
  "workflow_dispatch": {
   "inputs": {
    "what": {
     "description": "Build which?",
     "type": "choice",
     "default": "exe",
     "options": [
      "exe",
      "apk"
     ]
    }
   }
  }
 }
}