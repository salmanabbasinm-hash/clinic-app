var idb=null,mem={};
var KEYP={patients:'uid',visits:'uid',sms:'uid',meds:'id',diets:'id',kv:'k'};
function openDB(){return new Promise(function(res){try{var r=indexedDB.open('clinic-mobile',1);
  r.onupgradeneeded=function(){var d=r.result;Object.keys(KEYP).forEach(function(s){d.createObjectStore(s,{keyPath:KEYP[s]})})};
  r.onsuccess=function(){idb=r.result;res()};r.onerror=function(){res()};r.onblocked=function(){res()}}catch(e){res()}})}
function all(s){return new Promise(function(res){if(!idb)return res((mem[s]||[]).slice());try{var q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){res([])}}catch(e){res([])}})}
function putMany(s,arr){return new Promise(function(res){if(!idb){mem[s]=mem[s]||[];arr.forEach(function(o){var i=mem[s].findIndex(function(x){return x[KEYP[s]]===o[KEYP[s]]});if(i>=0)mem[s][i]=o;else mem[s].push(o)});return res()}
  try{var t=idb.transaction(s,'readwrite'),st=t.objectStore(s);arr.forEach(function(o){st.put(o)});t.oncomplete=function(){res()};t.onerror=function(){res()}}catch(e){res()}})}
function delKeys(s,keys){return new Promise(function(res){if(!idb){mem[s]=(mem[s]||[]).filter(function(x){return keys.indexOf(x[KEYP[s]])<0});return res()}
  try{var t=idb.transaction(s,'readwrite'),st=t.objectStore(s);keys.forEach(function(k){st.delete(k)});t.oncomplete=function(){res()};t.onerror=function(){res()}}catch(e){res()}})}
function clearAll(){return Promise.all(Object.keys(KEYP).map(function(s){return all(s).then(function(a){return delKeys(s,a.map(function(x){return x[KEYP[s]]}))})}))}

function catList(){var c=[];S.diets.forEach(function(d){if(d.cat&&c.indexOf(d.cat)<0)c.push(d.cat)});if(c.indexOf(DEF_CAT)<0)c.unshift(DEF_CAT);return c}
function dietFor(pulse,cat){var d=S.diets.find(function(x){return x.cat===cat&&x.mizaj===(pulse||'').trim()+' غذائیں'});if(!d&&pulse&&isFlat(cat))d=catRows(cat)[0];return d?(d.text||'').replace(/​/g,''):null}

function dueList(){
  var t=today(),out=[];
  S.patients.forEach(function(p){var v=lastVisit(p);if(!v||!isActive(v))return;var nd=nextDate(v);if(!nd)return;
    out.push({p:p,v:v,nd:nd,diff:diffDays(nd,t)})});
  return out;
}

  else if(remTab==='late')f=d.filter(function(x){return x.diff<0&&x.diff>=-30});
  else f=d.filter(function(x){return x.diff>=2&&x.diff<=7});

  var q=S.queue.map(function(m){return '<div class="card"><div class="row" style="justify-content:space-between"><b class="ur">'+esc(m.name||m.phone)+'</b><span class="chip warn">PC سے</span></div><div class="ur pre" style="font-size:16px">'+esc(m.text)+'</div>'+

     (x.p.phone?'<div class="row" style="margin-top:8px"><button class="btn sm grow" data-act="sendr" data-u="'+x.v.uid+'">SMS بھیجیں</button><button class="btn sm alt" data-act="copyr" data-u="'+x.v.uid+'">کاپی</button></div>':'')+'</div>'}).join('')||'<div class="empty">اس زمرے میں کوئی نہیں</div>')+'</div>'+

function isFlat(cat){var r=catRows(cat);if(!r.length)return false;var t=(r[0].text||'').trim();return r.every(function(x){return (x.text||'').trim()===t})}

}

  toast('PC تلاش کی جا رہی ہے…');var pref=m[1]+m[2]+'.',port=m[4]?':'+m[4]:'',found=null,i=1;
  async function probe(n){var u=pref+n+port;try{var c=new AbortController(),t=setTimeout(function(){c.abort()},1500);var r=await fetch(u+'/api/ping',{headers:{'X-Token':S.cfg.token},signal:c.signal});clearTimeout(t);var j=await r.json();if(j&&j.name==='Clinic Sync'&&j.auth&&!found)found=u}catch(e){}}
  while(i<=254&&!found){var batch=[];for(var k=0;k<40&&i<=254;k++,i++)batch.push(probe(i));await Promise.all(batch)}

}

async function applySnap(snap){
    // drop demo rows, then merge snapshot (server wins unless a local edit failed)
    var demoP=S.patients.filter(function(p){return p._demo}).map(function(p){return p.uid});
    if(demoP.length){S.visits=S.visits.filter(function(v){return demoP.indexOf(v.puid)<0});S.patients=S.patients.filter(function(p){return !p._demo});await delKeys('patients',demoP)}
    var byPid={};S.patients.forEach(function(p){if(p.pid)byPid[p.pid]=p});
    snap.patients.forEach(function(sp){var l=byPid[sp.pid];if(!l){l=Object.assign({uid:'p'+sp.pid},sp);l._dirty=false;S.patients.push(l);byPid[sp.pid]=l}else if(!l._dirty){PAT_KEYS.forEach(function(k){l[k]=sp[k]});l.base=sp.hash}});
    var byV={};S.visits.forEach(function(v){if(v.pid&&v.vid)byV[v.pid+'/'+v.vid]=v});
    snap.visits.forEach(function(sv){var l=byV[sv.pid+'/'+sv.vid],pt=byPid[sv.pid];if(!pt)return;
      if(!l){l=Object.assign({uid:'v'+sv.pid+'-'+sv.vid,puid:pt.uid},sv);l._dirty=false;S.visits.push(l);byV[sv.pid+'/'+sv.vid]=l}else if(!l._dirty){VIS_KEYS.forEach(function(k){l[k]=sv[k]});l.base=sv.hash;l.puid=pt.uid}});
    S.visits.forEach(function(v){if(!v.pid){var pt=patientOf(v);if(pt&&pt.pid)v.pid=pt.pid}});
    var oldM=S.meds.map(function(x){return x.id}),oldD=S.diets.map(function(x){return x.id}),keepM=S.meds.filter(function(x){return x._dirty}),keepD=S.diets.filter(function(x){return x._dirty});
    await delKeys('meds',oldM);await delKeys('diets',oldD);
    S.meds=snap.meds.filter(function(x){return (S.cfg.medDel||[]).indexOf(x.id)<0}).concat(keepM);S.diets=snap.diets.concat(keepD);S.queue=snap.queue||S.queue||[];S.cfg.last=Date.now();
    await Promise.all([putMany('patients',S.patients),putMany('visits',S.visits),putMany('sms',S.sms),putMany('meds',S.meds),putMany('diets',S.diets),saveCfg()]);
}

async function mergeData(){

  if(!o||(!o.patients&&!o.visits)){toast('فائل میں مریضوں کا ڈیٹا نہیں ملا');return}
  await busyOn('نئی انٹریز ملائی جا رہی ہیں…');
  try{
    function nk(x){return ((x.name||'')+'|'+(x.phone||'')).replace(/\s+/g,'').toLowerCase()}
    var addP=0,addV=0,map={};
    (o.patients||[]).forEach(function(p){if(p._demo)return;
      var f=S.patients.find(function(x){return x.uid===p.uid||(p.pid&&x.pid&&String(x.pid)===String(p.pid))||(p.name&&nk(x)===nk(p))});
      if(f){map[p.uid]=f.uid;return}

      if(dup)return;var q=Object.assign({},v);q.puid=pu;q._dirty=true;S.visits.push(q);addV++});
    await Promise.all([putMany('patients',S.patients),putMany('visits',S.visits),saveCfg()]);
    busyOff();toast('ملا دیا: '+addP+' نئے مریض، '+addV+' نئی وزٹس (پرانا ڈیٹا جوں کا توں)');render();autoSync()

function splitDiet(text){
  var names=PULSES8.concat(PULSES6),pos=[];
  names.forEach(function(n){var re=new RegExp('(^|\\n)[ \\t•\\-–]*'+n.replace(/ /g,'\\s+')+'(\\s*غذائیں)?\\s*[:：\\-–]?[ \\t]*(?=\\n|$)','g'),m;
    while((m=re.exec(text))){pos.push({n:n,s:m.index,e:m.index+m[0].length})}});
  pos.sort(function(a,b){return a.s-b.s});
  return pos.map(function(p,i){return {miz:p.n,text:text.slice(p.e,i+1<pos.length?pos[i+1].s:text.length).replace(/^\s+|\s+$/g,'')}}).filter(function(x){return x.text})}

async function zipEntry(buf,target){var u8=new Uint8Array(buf),dv=new DataView(buf),e=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('یہ درست docx فائل نہیں');
  var cnt=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true);
  for(var k=0;k<cnt;k++){if(dv.getUint32(p,true)!==0x02014b50)break;
    var meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true),
      nm=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    if(nm===target){var st=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true),data=u8.slice(st,st+cs);
      if(meth===0)return data;
      if(meth!==8||typeof DecompressionStream==='undefined')throw new Error('اس براؤزر میں docx نہیں کھل سکتی، متن کاپی کر کے پیسٹ کریں');
      return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
    p+=46+nl+el+cl}
  throw new Error('docx میں متن نہیں ملا')}
async function docxText(buf){var xml=new TextDecoder('utf-8').decode(await zipEntry(buf,'word/document.xml')),doc=new DOMParser().parseFromString(xml,'application/xml'),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',out=[];
  Array.prototype.forEach.call(doc.getElementsByTagNameNS(W,'p'),function(p){var t='';
    (function walk(n){Array.prototype.forEach.call(n.childNodes,function(c){if(c.nodeType!==1)return;var ln=c.localName;
      if(ln==='t')t+=c.textContent;else if(ln==='tab')t+='\t';else if(ln==='br'||ln==='cr')t+='\n';else walk(c)})})(p);out.push(t)});
  return out.join('\n')}
async function fileText(f){var n=f.name.toLowerCase();
  if(/\.txt$/.test(n))return await f.text();
  var buf=await f.arrayBuffer();
  if(/\.docx$/.test(n))return await docxText(buf);
  if(/\.pdf$/.test(n)){var L=await loadPdfLib();
    var doc=await L.getDocument({data:buf}).promise,out=[];
    for(var i=1;i<=doc.numPages;i++){var pg=await doc.getPage(i),tc=await pg.getTextContent(),lines={};
      tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push(it)});
      Object.keys(lines).map(Number).sort(function(a,b){return b-a}).forEach(function(y){var its=lines[y].sort(function(a,b){return a.transform[4]-b.transform[4]});
        var rtl=/[\u0600-\u06FF]/.test(its.map(function(x){return x.str}).join(''));if(rtl)its.reverse();out.push(its.map(function(x){return x.str}).join(' ').replace(/\s+/g,' ').trim())});out.push('')}
    return out.join('\n')}
  throw new Error('صرف Word (.docx)، PDF یا .txt فائل چنیں')}
